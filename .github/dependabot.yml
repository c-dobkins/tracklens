version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-modules: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      npm-dev:
        dependency-type: development
      npm-runtime:
        dependency-type: production
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
